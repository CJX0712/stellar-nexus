#
# 用法（完整复现，含开发工具）:
#     python -m venv .venv && source .venv/bin/activate
#     pip install -r requirements.lock
#     pip install -e . --no-deps
#
# 只装运行时依赖（生产）:
#     pip install -e .
#
# 说明:
# - 全部依赖在 win_amd64 与 manylinux 上都有预编译轮子，无需编译器。
#     可用 `python scripts/check_wheels.py --platform linux --python cp313` 复核。
# - colorama 仅在 Windows 控制台着色时需要，Linux 上装了也无害。
# - 本文件刻意不含 `-e .`：那会写入本机绝对路径，破坏他人复现。
